name: CI

# Runs the test suite (type check + node:test), a production dependency audit and an axe scan of
# every /demo tab on every change, so a broken PR is caught before Vercel deploys it. "CI gate" is the single status
# to require in a main-branch ruleset or a Vercel Deployment Check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:a11y

  feeds:
    name: News feeds (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm run check:feeds

  gate:
    name: CI gate
    needs: [test, a11y]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.a11y.result }}" = success
