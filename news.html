<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News · Cortex</title>
  <meta name="description" content="Cortex News: headlines by category, from free RSS feeds.">
  <meta name="theme-color" content="#04080e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-auth="pending">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar" data-page="news"></header>

  <p class="notice" id="notice" role="alert" hidden></p>

  <main id="main" class="page news">
    <div class="page-head">
      <h1>News</h1>
      <p class="page-lede">Headlines by category, from free RSS feeds. Each one opens the article on its own site.</p>
    </div>

    <div class="news-bar">
      <div class="chips" id="news-filters" role="group" aria-label="Show headlines from"></div>
      <p class="panel-note" id="news-status" role="status">Loading…</p>
    </div>
    <div id="news-sections"></div>
  </main>

  <footer class="ticker">
    <span>Cortex 1.0</span>
    <span>Scope: drive.readonly</span>
    <span id="ticker-sync">Last sync: never</span>
  </footer>

  <script src="/config.js"></script>
  <script src="/src/demo/mode.js"></script>
  <script src="/header.js"></script>
  <script src="/drive.js"></script>
  <script src="/brain.js"></script>
  <script src="/news.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
